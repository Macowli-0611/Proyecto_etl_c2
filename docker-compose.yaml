services:
  # Analytical Data Warehouse (PostgreSQL 16)
  postgres_dw:
    image: postgres:16-alpine
    container_name: etl_c2_postgres_dw
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_dw}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_c2:/var/lib/postgresql/data
      - ./sql:/sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-etl_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_c2:
