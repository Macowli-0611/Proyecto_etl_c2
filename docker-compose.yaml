services:
  # Analytical Data Warehouse (PostgreSQL 16)
  postgres_dw:
    image: postgres:16-alpine
    container_name: etl_c2_postgres_dw
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_dw}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_c2:/var/lib/postgresql/data
      - ./sql:/sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-etl_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Airflow 3.1.8 Web UI & Orchestrator
  airflow:
    image: workshop2-airflow:3.1.8
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl_c2_airflow
    depends_on:
      postgres_dw:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE=/opt/airflow/simple_auth_manager_passwords.json
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - PYTHONPATH=/opt/airflow
      - DB_HOST=postgres_dw
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-etl_dw}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - PRIMARY_DATA_URL=${PRIMARY_DATA_URL:-https://www.datos.gov.co/api/views/vuyt-mqpw/rows.csv?accessType=DOWNLOAD}
      - API_BASE_URL=${API_BASE_URL:-https://www.datos.gov.co/resource/7tuu-upb2.json}
      - API_APP_TOKEN=${API_APP_TOKEN:-}
      - API_TIMEOUT_SECONDS=30
      - API_PAGE_LIMIT=2000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    ports:
      - "8080:8080"
    command: airflow standalone
    restart: unless-stopped

volumes:
  pgdata_c2:

